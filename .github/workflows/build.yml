name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The trading core, the gateway, the trade CLI, provisioning and the bridge protocol are all
  # cross-platform, so they are tested on every OS. Only the ATAS adapter and the installer are
  # Windows-bound. Every project in TradeAgent.sln is covered, so a new project is in this matrix as
  # soon as it is in the solution.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TradeAgent.sln
      - run: dotnet build TradeAgent.sln -c Release --no-restore

      # THE SUITE MINUS ONE CATEGORY — every platform, no retry, no rescue. A red here is a red run.
      # This is 833 of the 914 tests, including every test that asserts what the product does.
      - name: Test everything outside the timing category
        run: dotnet test TradeAgent.sln -c Release --no-build --filter "Category!=Timing" --logger "trx;LogFileName=results.trx"

      # THE TIMING CATEGORY — run everywhere, RE-RUN ONCE ON EVERY RUNNER.
      #
      # WHAT THE CATEGORY MEANS, ONCE, SO NOTHING ELSE DRIFTS INTO IT: a test belongs here when its
      # verdict needs the RUNNER to keep a wall clock as well as the product to be right — it either
      # measures a duration and asserts a ceiling on it, or asserts an outcome that the product only
      # reaches while a deadline of its own is still open. Every other test in this repository
      # decides on what the product DID, and a red there is a red run on the first attempt, on all
      # three platforms, with no rescue. Membership is not a place to send a test that fails; it is
      # a statement about what the test measures, and it is argued at the test with numbers.
      #
      # WHY A SECOND ATTEMPT AT ALL. `RunnerSpeedProbeTests` measures, on every run and every
      # platform, how much slower the runner is than the machine these fixtures were tuned on. Over
      # three runs of PR #4 the windows-latest figures were: arithmetic 1.20/1.22/1.06, timers
      # 1.02/1.18/1.08, pipes 2.24/2.54/3.31 — and file IO 3.79/39.52/4.89. File IO is what the
      # failures are made of and it is the one that will not hold still, so there is no factor to
      # scale the fixtures by: covering the worst of those three needs more than 40x, applied to
      # fixtures whose real bottleneck is 1.08x. Six windows-only reds across three fix units, one
      # per run, each fixed by hand. This is the net under them.
      #
      # WHY IT IS NO LONGER WINDOWS-ONLY. That rule rested on the spread being Windows's alone, and
      # U-press-stopwatch measured otherwise. A throwaway harness timed one emergency press per step
      # on all three runners: the single SQLite settle it makes after its deadline —
      # `SafelyRecordIndefinite`, at `synchronous=FULL` — cost 3 ms on ubuntu in two runs and 547 ms
      # and 593 ms in a third, off the same code and the same fixture, which is the same 200x spread
      # by a different name. A 20 ms tick on a dedicated thread and on the pool kept arriving at
      # 21 ms through all of it and GC pause was 0, so the process was running: it is the runner's
      # disk. Ubuntu had already spent one red on it (run 33986791747, 1243 ms over) and windows one
      # more (33973192760). A rule that reads "windows is the flaky one" is now simply wrong.
      #
      # WHAT IT COSTS, SAID PLAINLY: inside this category a genuine regression that fails
      # intermittently can be rescued by the second attempt. That is why membership is argued rather
      # than granted, why the first failure is printed, named in the job summary, annotated on the
      # run and uploaded as its own trx — and why a red twice in a row is still a red run, on every
      # platform, with nothing left to try.
      - name: Test the timing category
        shell: bash
        run: |
          set -uo pipefail
          # THE WHOLE SOLUTION, not the one project that has timing tests today: a project with no
          # match exits 0 with "No test matches the given testcase filter" (verified), so this stays
          # correct if the trait ever lands outside the integration assembly. The two steps together
          # run every test exactly once.
          if dotnet test TradeAgent.sln -c Release --no-build \
               --filter "Category=Timing" --logger "trx;LogFileName=results-timing.trx"; then
            exit 0
          fi

          # THE FIRST FAILURE IS THE RECORD, whatever the second attempt goes on to say.
          failed=$(cat tests/*/TestResults/results-timing.trx 2>/dev/null | tr '<' '\n' \
                   | grep 'outcome="Failed"' | grep -o 'testName="[^"]*"' | cut -d'"' -f2 || true)
          {
            echo "### The timing category failed on its first attempt"
            echo
            echo '```'
            echo "${failed:-(no test name in the trx - read the step log above)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Timing category failed on its first attempt::${failed//$'\n'/, }"

          echo "Re-running the timing category once; the failure above stands in the record either way."
          dotnet test TradeAgent.sln -c Release --no-build \
            --filter "Category=Timing" --logger "trx;LogFileName=results-timing-retry.trx"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          # results*.trx, so a rescued run uploads the attempt that failed as well as the one that
          # passed. A green whose second trx exists is a green that needed two attempts.
          path: '**/results*.trx'

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # packaging/build.ps1 is run with -RequireInstaller below, so a missing Inno Setup fails the
      # job instead of quietly uploading an artifact with no installer in it. This step makes that
      # failure impossible for a reason nobody can act on: if the runner image stops shipping Inno
      # Setup, install it here rather than discovering it as an empty release.
      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if ($iscc) {
            Write-Host "Inno Setup already on this image: $iscc"
          } else {
            Write-Host 'Inno Setup not found on this image; installing it.'
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
          }

      # No ATAS on a hosted runner, so the bridge is published without its ATAS adapter and the
      # artifact is labelled accordingly. A release build must be produced on a machine with ATAS.
      # The script verifies the staged build before packaging and prints a manifest of what the
      # artifact actually contains; read that in this step's log before trusting a release.
      - name: Build the installer
        run: pwsh packaging/build.ps1 -SkipTests -RequireInstaller

      - uses: actions/upload-artifact@v7
        with:
          name: TradeAgent-windows-x64-NO-ATAS-ADAPTER
          # if-no-files-found: error, because an artifact named after an installer that is not in it
          # is worse than no artifact at all.
          if-no-files-found: error
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt

  # THE LINUX HOST'S BUILD (U-linux-host item 3): packaging/build-linux.sh, self-contained linux-x64 with
  # `trade` and `tradeagent-gateway` single-file beside the app, its stage verified before it is packaged,
  # uploaded as TradeAgent-linux-x64 with the SHA256SUMS that names the tarball.
  #
  # NOT BEHIND `test`, deliberately: it is the input of `linux-host` below, and run beside the suites it
  # adds nothing to how long a branch's CI takes. A release is still cut by hand from a green run.
  # PINNED: the runner image and the SDK both, so what this job proves is the same thing on every branch.
  package-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'

      # THE SDK, PINNED HERE AND NOWHERE ELSE: a global.json written in the job, not committed — the
      # rest of the build floats on 10.0.x — so this publish uses exactly the SDK above or fails saying so.
      - name: Pin the SDK
        run: |
          printf '{ "sdk": { "version": "10.0.400", "rollForward": "disable" } }\n' > global.json
          dotnet --version

      - name: Lint the Linux scripts
        run: |
          shellcheck --version
          shellcheck packaging/build-linux.sh packaging/linux/install.sh packaging/linux/display-prepare packaging/linux/ci/prove.sh

      - name: Build the Linux artifact
        run: packaging/build-linux.sh --runtime linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: TradeAgent-linux-x64
          if-no-files-found: error
          path: |
            artifacts/linux/TradeAgent-*-linux-x64.tar.gz
            artifacts/linux/SHA256SUMS

  # THE APP UNATTENDED ON A LINUX HOST (U-linux-host item 5) — the one place it is ever run on Linux before the
  # owner's own host. package-linux's artifact goes through the real kit (packaging/linux/install.sh) on a
  # runner pinned to ubuntu-24.04 (ubuntu-latest becomes 26.04 in November 2026), and packaging/linux/ci/prove.sh
  # runs it for twenty minutes against the unit's observable result: a seeded paper home records a loopback
  # tape row, records again within 30 s of kill -9, stops within 15 s of `systemctl stop` with its quit recorded,
  # listens on no network, and its window's screenshot, peak RSS and the tape's growth are uploaded.
  #
  # DETERMINISTIC ON PURPOSE, because every branch in the fleet runs it: every package it installs is pinned
  # to its version in noble's release pocket (which never changes), and every host of a venue the app knows is
  # mapped to 127.0.0.1 before the app starts — no exchange is ever asked from a US runner, and the one source
  # that answers is the job's own loopback server. It reads the app's home with sqlite3 -readonly, never the pipe.
  linux-host:
    needs: package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: TradeAgent-linux-x64
          path: linux-artifact

      - name: Map every venue the app knows to 127.0.0.1
        run: |
          venues="fapi.binance.com eea.okx.com www.okx.com data.gdeltproject.org data-api.binance.vision data.binance.vision api.hyperliquid.xyz"
          for h in $venues; do echo "127.0.0.1 $h"; done | sudo tee -a /etc/hosts
          for h in $venues; do
            resolved="$(getent ahosts "$h" | awk '{ print $1 }' | sort -u | tr '\n' ' ')"
            [ "$resolved" = "127.0.0.1 " ] || { echo "$h resolves to '$resolved', not 127.0.0.1 alone"; exit 1; }
          done

      - name: Install the host's packages, each one pinned
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libx11-6=2:1.8.7-1build1 libxext6=2:1.3.4-1build2 libxi6=2:1.8.1-1build1 libxrandr2=2:1.5.2-2build1 \
            libxcursor1=1:1.2.1-1build1 libice6=2:1.0.10-1build3 libsm6=2:1.2.3-1build3 \
            libfontconfig1=2.15.0-1.1ubuntu2 fonts-dejavu-core=2.37-8 \
            tigervnc-standalone-server=1.13.1+dfsg-2build2 tigervnc-common=1.13.1+dfsg-2build2 \
            tigervnc-tools=1.13.1+dfsg-2build2 xauth=1:1.1.2-1build1 \
            x11-apps=7.7+11build3 netpbm=2:11.05.02-1.1build1
          sqlite3 --version

      - name: Install TradeAgent with the kit, twice
        run: |
          address="$(ip -4 -o addr show scope global | awk '{ print $4 }' | cut -d/ -f1 | head -n 1)"
          echo "ADDRESS=$address" >> "$GITHUB_ENV"
          (umask 077 && head -c 512 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 8 > "$RUNNER_TEMP/vnc-pass")
          sudo packaging/linux/install.sh --tarball linux-artifact/TradeAgent-*-linux-x64.tar.gz \
            --address "$address" --zone Europe/Brussels --vnc-pass-file "$RUNNER_TEMP/vnc-pass"
          # IDEMPOTENT: the same arguments again change nothing and restart nothing.
          pid="$(systemctl show -p MainPID --value tradeagent.service)"
          sudo packaging/linux/install.sh --tarball linux-artifact/TradeAgent-*-linux-x64.tar.gz \
            --address "$address" --zone Europe/Brussels --vnc-pass-file "$RUNNER_TEMP/vnc-pass"
          [ "$(systemctl show -p MainPID --value tradeagent.service)" = "$pid" ] || { echo "the second run restarted the app"; exit 1; }
          rm -f "$RUNNER_TEMP/vnc-pass"

      - name: Twenty minutes unattended
        run: |
          sudo env OUT="$GITHUB_WORKSPACE/linux-host-evidence" ADDRESS="$ADDRESS" RUN_MINUTES=20 \
            GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" packaging/linux/ci/prove.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-host-evidence
          path: linux-host-evidence/
