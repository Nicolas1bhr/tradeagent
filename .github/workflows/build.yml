name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# DIAGNOSTIC WORKFLOW — U-fix-press-budget item 1, BRANCH ONLY. Windows only; the suite runs as it
# always does (three assemblies at once, the load the sighting failed under) with the branch-only
# PressBudgetDiagTests inside it, then the sighting's class and the diagnostic are looped on their
# own. The three-platform workflow is restored, byte for byte, before the proving run.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TradeAgent.sln
      - run: dotnet build TradeAgent.sln -c Release --no-restore

      - name: The suite under its own load, with the press diagnostic inside it
        shell: bash
        env:
          PRESSDIAG_N: '30'
        run: |
          set -uo pipefail
          export PRESSDIAG_OUT="$(pwd -W)/pressdiag-load.txt"
          rm -f pressdiag-load.txt
          dotnet test TradeAgent.sln -c Release --no-build --filter "Category!=Timing" --logger "trx;LogFileName=results.trx"

      - name: The diagnostic's output under load
        if: always()
        shell: bash
        run: cat pressdiag-load.txt || echo "no diagnostic output"

      - name: The sighting's class and the diagnostic, looped on their own
        if: always()
        shell: bash
        env:
          PRESSDIAG_N: '5'
        run: |
          set -uo pipefail
          export PRESSDIAG_OUT="$(pwd -W)/pressdiag-loop.txt"
          rm -f pressdiag-loop.txt
          red=0
          for i in $(seq 1 12); do
            dotnet test tests/TradeAgent.FaultTests/TradeAgent.FaultTests.csproj -c Release --no-build \
              --filter "FullyQualifiedName~TradeAgent.Tests.Fault.PressIdShapeTests|FullyQualifiedName~TradeAgent.Tests.Fault.PressBudgetDiagTests" \
              --logger "trx;LogFileName=results-loop-$i.trx" > loop.log 2>&1 \
              || { red=$((red+1)); echo "iteration $i RED"; cat loop.log; }
          done
          echo "looped 12 x (PressIdShapeTests + PressBudgetDiagTests): $red red"
          grep "^=== " pressdiag-loop.txt || echo "no loop output"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pressdiag-${{ matrix.os }}
          path: |
            pressdiag-*.txt
            **/results*.trx
