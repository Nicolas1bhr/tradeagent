name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The trading core, the gateway, the trade CLI and the bridge protocol are cross-platform, so they
  # are tested on every OS. Only the ATAS adapter and the installer are Windows-bound.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TradeAgent.sln
      - run: dotnet build TradeAgent.sln -c Release --no-restore
      - run: dotnet test TradeAgent.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/results.trx'

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # No ATAS on a hosted runner, so the bridge is published without its ATAS adapter and the
      # artifact is labelled accordingly. A release build must be produced on a machine with ATAS.
      - run: pwsh packaging/build.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: TradeAgent-windows-x64-NO-ATAS-ADAPTER
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
