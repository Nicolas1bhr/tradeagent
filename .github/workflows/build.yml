name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# DIAGNOSTIC WORKFLOW — U-fix-loss-reopen item 1, BRANCH ONLY. Windows only; the suite runs as it
# always does (three assemblies at once, which is the load both sightings failed under) with the
# branch-only LossFlattenDiagTests inside it, then the two sighting classes are looped on their own.
# The three-platform workflow is restored before the proving run.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TradeAgent.sln
      - run: dotnet build TradeAgent.sln -c Release --no-restore

      - name: The suite under its own load, with the loss-flatten diagnostic inside it
        shell: bash
        env:
          LOSSDIAG_N: '30'
        run: |
          set -uo pipefail
          export LOSSDIAG_OUT="$(pwd -W)/lossdiag.txt"
          rm -f lossdiag.txt
          dotnet test TradeAgent.sln -c Release --no-build --filter "Category!=Timing" --logger "trx;LogFileName=results.trx"
          echo "suite exit: $?"

      - name: The diagnostic's own output
        if: always()
        shell: bash
        run: cat lossdiag.txt || echo "no diagnostic output"

      - name: The two sighting classes, looped
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          red=0
          for i in $(seq 1 12); do
            dotnet test tests/TradeAgent.FaultTests/TradeAgent.FaultTests.csproj -c Release --no-build \
              --filter "FullyQualifiedName~TradeAgent.Tests.Fault.LossWatchTests" --logger "trx;LogFileName=loop-watch-$i.trx" > loop.log 2>&1 \
              || { red=$((red+1)); echo "LossWatchTests iteration $i RED"; cat loop.log; }
            dotnet test tests/TradeAgent.UnitTests/TradeAgent.UnitTests.csproj -c Release --no-build \
              --filter "FullyQualifiedName~TradeAgent.Tests.Unit.LossHoldSurfacesTests" --logger "trx;LogFileName=loop-hold-$i.trx" > loop.log 2>&1 \
              || { red=$((red+1)); echo "LossHoldSurfacesTests iteration $i RED"; cat loop.log; }
          done
          echo "looped 12 x 2 classes: $red red"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lossdiag-${{ matrix.os }}
          path: |
            lossdiag.txt
            **/results*.trx
